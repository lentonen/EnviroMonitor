services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enviromonitor-frontend
    command: pnpm dev --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: postgres:17
    container_name: enviro-monitor-postgres
    environment:
      POSTGRES_DB: enviro_monitor
      POSTGRES_USER: enviro_monitor
      POSTGRES_PASSWORD: enviro_monitor
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
