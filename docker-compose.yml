services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enviromonitor-frontend
    command: pnpm dev --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
