[project]
name = "enviro-monitor-backend"
version = "0.1.0"
description = "Minimal weather ingestion backend for EnviroMonitor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "httpx>=0.28.0,<0.29.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enviro_monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
